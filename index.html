<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IAS Document Routing</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f4f6fa; color: #1c2430; padding: 16px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #12161d; color: #e6e9ef; } }
  .box { max-width: 420px; text-align: center; }
  .muted { opacity: .7; font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <h1 style="font-size:20px">IAS Document Routing</h1>
  <p id="msg">Binubuksan ang system…</p>
  <p class="muted" id="sub"></p>
</div>
<script>
// Fixed address for the demo. The real address (a temporary Cloudflare link) is written to link.json by
// scripts\start-demo.cmd each time the demo starts; this page just forwards to it.
(async () => {
  const msg = document.getElementById('msg'), sub = document.getElementById('sub');
  try {
    // absolute, so it also works from 404.html on a deep link such as /ias-drs/q/abc
    const r = await fetch('/' + location.pathname.split('/')[1] + '/link.json?t=' + Date.now(), { cache: 'no-store' });
    const { url } = await r.json();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) throw new Error('bad link');
    // keep a deep link (e.g. a scanned QR: …/ias-drs/#/doc/12) when forwarding
    const base = location.pathname.replace(/^\/[^/]+\/?/, '/').replace(/index\.html$|404\.html$/, '');
    location.replace(url + (base === '/' ? '/' : base) + location.search.replace(/[?&]t=\d+/, '') + location.hash);
  } catch {
    msg.textContent = 'Hindi bukas ang system ngayon.';
    sub.textContent = 'Naka-off o nire-restart ang demo server. Subukan ulit mamaya.';
  }
})();
</script>
</body>
</html>
